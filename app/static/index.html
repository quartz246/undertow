<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undertow — the current under the polls</title>
<meta name="description" content="A 2026 Senate forecast that maps Qloo cultural taste data from state to block level to find where the polls may be wrong.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M0 9q4-4 8 0t8 0v7H0z%22 fill=%22%230f7b6c%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Undertow</h1>
    <p>The 2026 Senate forecast, with the current under the polls mapped down to the block.</p>
  </div>
  <div class="office" role="radiogroup" aria-label="Office">
    <button role="radio" aria-checked="true" data-office="senate">Senate</button>
    <button role="radio" aria-checked="false" data-office="governor">Governor</button>
  </div>
  <div class="tally" id="tally" aria-live="polite"></div>
  <div class="topbtns"><button class="tbtn" id="tools-btn">Tools</button><button class="tbtn ghost" id="about-btn">About</button></div>
</header>

<main class="layout">
  <section class="mapwrap">
    <div id="map" role="application" aria-label="Forecast map. Click a state to open its race; zoom in for county, cell and block level."></div>
    <div id="map24" hidden aria-hidden="true"></div>
    <div id="swipe" hidden><span class="lab l">2026 forecast</span><button class="grip" aria-label="Drag to compare the two maps"></button><span class="lab r">2024 president</span></div>
    <div class="mapbar">
      <div class="seg" role="radiogroup" aria-label="Map layer">
        <button role="radio" aria-checked="true" data-mode="forecast">2026 forecast</button>
        <button role="radio" aria-checked="false" data-mode="undertow">Undertow</button>
        <button role="radio" aria-checked="false" data-mode="r24">2024 result</button>
      </div>
      <form class="search" id="search" role="search" autocomplete="off">
        <input id="q" type="search" placeholder="ZIP code or city" aria-label="Search a ZIP code, city or state" aria-controls="sugg" aria-autocomplete="list">
        <ul id="sugg" class="sugg" role="listbox" hidden></ul>
      </form>
      <button class="cmp" data-cmp="r24" aria-pressed="false">2026 ↔ 2024</button>
      <button class="cmp" data-cmp="qloo" aria-pressed="false">Polls ↔ Qloo</button>
      <div class="zoomhint" id="zoomhint">States → zoom for counties → ~5 km Qloo cells → live block scan (~150 m)</div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="scan" id="scan" hidden></div>
    <div class="tip" id="tip" hidden></div>
  </section>

  <aside class="panel" id="panel">
    <div id="panel-body"></div>
  </aside>
</main>

<dialog id="welcome" class="welcome">
  <form method="dialog"><button class="x" aria-label="Close">×</button></form>
  <div id="welcome-body"></div>
</dialog>

<dialog id="how">
  <form method="dialog"><button class="x" aria-label="Close">×</button></form>
  <div id="how-body"></div>
</dialog>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
